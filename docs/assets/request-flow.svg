<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .card-accent { fill: #1c2128; stroke: #58a6ff; stroke-width: 2; rx: 8px; }
      .card-rag { fill: #1c2128; stroke: #7ee787; stroke-width: 2; rx: 8px; }
      .card-tool { fill: #1c2128; stroke: #d2a8ff; stroke-width: 2; rx: 8px; }
      .card-action { fill: #1c2128; stroke: #ffa657; stroke-width: 2; rx: 8px; }
      .card-esc { fill: #1c2128; stroke: #ff7b72; stroke-width: 2; rx: 8px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
      .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #79c0ff; }
      .arrow { stroke: #58a6ff; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-muted { stroke: #484f58; stroke-width: 1.5; stroke-dasharray: 4; fill: none; marker-end: url(#arrow-gray); }
      .arrow-green { stroke: #7ee787; stroke-width: 1.5; fill: none; marker-end: url(#arrow-green-m); }
      .arrow-purple { stroke: #d2a8ff; stroke-width: 1.5; fill: none; marker-end: url(#arrow-purple-m); }
      .arrow-orange { stroke: #ffa657; stroke-width: 1.5; fill: none; marker-end: url(#arrow-orange-m); }
      .arrow-red { stroke: #ff7b72; stroke-width: 1.5; fill: none; marker-end: url(#arrow-red-m); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#484f58" />
    </marker>
    <marker id="arrow-green-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7ee787" />
    </marker>
    <marker id="arrow-purple-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d2a8ff" />
    </marker>
    <marker id="arrow-orange-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ffa657" />
    </marker>
    <marker id="arrow-red-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b72" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" class="bg" rx="12" />

  <!-- Title Header -->
  <text x="40" y="45" class="title">Enterprise IT Support Agent — Request Lifecycle Architecture</text>
  <text x="40" y="68" class="subtitle">Deterministic LangGraph orchestration, hybrid RAG retrieval, cross-user authorization guards, and observability</text>

  <!-- Flow Step 1: Client & Ingestion -->
  <g transform="translate(40, 100)">
    <rect width="240" height="150" class="card" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#1f6feb" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#58a6ff">STEP 1</text>
    <text x="12" y="52" class="card-title">Client Support Request</text>
    <text x="12" y="74" class="code">POST /api/v1/support</text>
    <text x="12" y="94" class="code">Header: X-API-Key</text>
    <text x="12" y="114" class="card-desc">JSON: { query, user_id? }</text>
    <text x="12" y="134" class="card-desc">Pydantic v2 Schema Validation</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 280 175 L 340 175" class="arrow" />

  <!-- Flow Step 2: Auth & Identity -->
  <g transform="translate(340, 100)">
    <rect width="250" height="150" class="card-accent" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#238636" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#7ee787">STEP 2</text>
    <text x="12" y="52" class="card-title">Auth &amp; Identity Guard</text>
    <text x="12" y="74" class="code">get_current_user dependency</text>
    <text x="12" y="94" class="card-desc">• Validates API Key / Bearer token</text>
    <text x="12" y="114" class="card-desc">• Derives effective_user_id</text>
    <text x="12" y="134" class="card-desc">• Blocks cross-user spoofing (403)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 590 175 L 650 175" class="arrow" />

  <!-- Flow Step 3: LangGraph Understand & Route -->
  <g transform="translate(650, 100)">
    <rect width="260" height="150" class="card-accent" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#a371f7" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#d2a8ff">STEP 3</text>
    <text x="12" y="52" class="card-title">LangGraph State Machine</text>
    <text x="12" y="74" class="code">understand_request</text>
    <text x="12" y="94" class="card-desc">• 9 Canonical Intent Classes</text>
    <text x="12" y="114" class="card-desc">• Entity Extraction (User, Device, INC)</text>
    <text x="12" y="134" class="code">route_request (Deterministic)</text>
  </g>

  <!-- Observability Box (Top Right) -->
  <g transform="translate(940, 100)">
    <rect width="220" height="150" class="card" />
    <rect x="12" y="12" width="105" height="20" rx="4" fill="#8957e5" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#d2a8ff">OBSERVABILITY</text>
    <text x="12" y="52" class="card-title">Telemetry &amp; Health</text>
    <text x="12" y="74" class="code">GET /metrics (Prometheus)</text>
    <text x="12" y="94" class="code">GET /health/ready</text>
    <text x="12" y="114" class="card-desc">• Token usage &amp; pricing</text>
    <text x="12" y="134" class="card-desc">• Node duration percentiles</text>
  </g>

  <!-- Connecting Arrows to Branches -->
  <path d="M 780 250 L 780 290 L 160 290 L 160 330" class="arrow-green" />
  <path d="M 780 250 L 780 290 L 450 290 L 450 330" class="arrow-purple" />
  <path d="M 780 250 L 780 290 L 740 290 L 740 330" class="arrow-orange" />
  <path d="M 780 250 L 780 290 L 1030 290 L 1030 330" class="arrow-red" />

  <!-- Branch Label -->
  <rect x="520" y="278" width="160" height="24" rx="4" fill="#21262d" stroke="#30363d" />
  <text x="532" y="294" class="badge-text" fill="#58a6ff">STEP 4: ROUTE EXECUTION</text>

  <!-- Route 1: Knowledge / Hybrid RAG -->
  <g transform="translate(40, 330)">
    <rect width="250" height="230" class="card-rag" />
    <rect x="12" y="12" width="130" height="20" rx="4" fill="#238636" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#7ee787">ROUTE: KNOWLEDGE</text>
    <text x="12" y="52" class="card-title">Hybrid RAG Pipeline</text>
    <text x="12" y="74" class="card-desc">1. FAISS Vector Retrieval (Dense)</text>
    <text x="12" y="94" class="card-desc">2. BM25Okapi Search (Exact Lexical)</text>
    <text x="12" y="114" class="card-desc">3. Reciprocal Rank Fusion (RRF)</text>
    <text x="12" y="134" class="card-desc">4. Cross-Encoder Reranker</text>
    <text x="24" y="150" class="code">ms-marco-MiniLM-L-6-v2</text>
    <text x="12" y="174" class="card-desc">5. Grounded LLM Response</text>
    <text x="24" y="190" class="code">**Sources:** cited metadata</text>
    <text x="12" y="214" class="badge-text" fill="#7ee787">Outcome: Status 200 OK</text>
  </g>

  <!-- Route 2: Tool Execution -->
  <g transform="translate(325, 330)">
    <rect width="250" height="230" class="card-tool" />
    <rect x="12" y="12" width="100" height="20" rx="4" fill="#8957e5" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#d2a8ff">ROUTE: TOOL</text>
    <text x="12" y="52" class="card-title">Read-Only Tools</text>
    <text x="12" y="74" class="card-desc">• Account Status (MFA/Lockout)</text>
    <text x="12" y="94" class="card-desc">• Device Health &amp; Registration</text>
    <text x="12" y="114" class="card-desc">• Existing Ticket Lookup</text>
    <text x="12" y="140" class="code">Authorization Guard</text>
    <text x="12" y="160" class="card-desc">Ensures record belongs to caller</text>
    <text x="12" y="180" class="card-desc">Prevents cross-user data leakage</text>
    <text x="12" y="214" class="badge-text" fill="#d2a8ff">Outcome: TOOL_COMPLETED</text>
  </g>

  <!-- Route 3: Action Execution (Ticket Creation) -->
  <g transform="translate(615, 330)">
    <rect width="250" height="230" class="card-action" />
    <rect x="12" y="12" width="110" height="20" rx="4" fill="#bd561d" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#ffa657">ROUTE: ACTION</text>
    <text x="12" y="52" class="card-title">Write Operations</text>
    <text x="12" y="74" class="card-desc">• Create Incident / Ticket</text>
    <text x="12" y="94" class="card-desc">• Category &amp; Priority Validation</text>
    <text x="12" y="114" class="card-desc">• Password Reset Self-Service</text>
    <text x="12" y="140" class="code">SQLite Atomic Write</text>
    <text x="12" y="160" class="card-desc">Generates permanent INC ID</text>
    <text x="12" y="180" class="card-desc">Maps user to authenticated ID</text>
    <text x="12" y="214" class="badge-text" fill="#ffa657">Outcome: ACTION_COMPLETED</text>
  </g>

  <!-- Route 4: Escalation & Clarification -->
  <g transform="translate(905, 330)">
    <rect width="255" height="230" class="card-esc" />
    <rect x="12" y="12" width="140" height="20" rx="4" fill="#da3633" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#ff7b72">ROUTE: ESCALATION</text>
    <text x="12" y="52" class="card-title">Human Support Handover</text>
    <text x="12" y="74" class="card-desc">• Repeated Troubleshooting Failure</text>
    <text x="12" y="94" class="card-desc">• Security Threats &amp; Phishing Alerts</text>
    <text x="12" y="114" class="card-desc">• Explicit Tier 2 Support Requests</text>
    <text x="12" y="140" class="code">Clarification Node</text>
    <text x="12" y="160" class="card-desc">Resolves missing query params</text>
    <text x="12" y="180" class="card-desc">Prompts for specific error info</text>
    <text x="12" y="214" class="badge-text" fill="#ff7b72">Outcome: ESCALATED / HANDOFF</text>
  </g>

  <!-- Converging to Step 5: Structured Response -->
  <path d="M 160 560 L 160 620 L 520 620 L 520 640" class="arrow-green" />
  <path d="M 450 560 L 450 620 L 560 620 L 560 640" class="arrow-purple" />
  <path d="M 740 560 L 740 620 L 640 620 L 640 640" class="arrow-orange" />
  <path d="M 1030 560 L 1030 620 L 680 620 L 680 640" class="arrow-red" />

  <!-- Flow Step 5: Structured Response Packaging -->
  <g transform="translate(340, 640)">
    <rect width="520" height="110" class="card-accent" />
    <rect x="12" y="12" width="60" height="20" rx="4" fill="#1f6feb" fill-opacity="0.2" />
    <text x="20" y="26" class="badge-text" fill="#58a6ff">STEP 5</text>
    <text x="80" y="26" class="card-title">HTTP 200 Structured SupportResponse</text>
    <text x="12" y="52" class="code">{ "request_id": "REQ-...", "user_id": "EMP0001", "intent": "...", "status": "COMPLETED" }</text>
    <text x="12" y="72" class="card-desc">Response text with troubleshooting guidance or action confirmation</text>
    <text x="12" y="92" class="code">"sources": [ { "document_id": "vpn_policy.md", "title": "Corporate VPN Guide" } ]</text>
  </g>

  <!-- Final Arrow back to Employee -->
  <path d="M 340 695 L 160 695 L 160 250" class="arrow-muted" />
  <rect x="180" y="683" width="130" height="22" rx="4" fill="#21262d" />
  <text x="190" y="698" class="badge-text" fill="#7ee787">Resolved Response</text>
</svg>
